name: Build NerdOCTAXE Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [nerdoctaxe-ui]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout UI customizations
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Checkout BTC Android Miner engine
        uses: actions/checkout@v4
        with:
          repository: VirtusVerbis/BTC_Anrdoid_Miner
          path: miner

      - name: Apply NerdOCTAXE Mobile UI
        run: python3 custom/tools/patch_nerdoctaxe_ui.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1"

      - name: Install Vulkan shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Build debug APK
        working-directory: miner
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nerdoctaxe-mobile-debug
          path: miner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
